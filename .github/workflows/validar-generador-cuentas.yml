name: Validar generador de cuentas

on:
  pull_request:
    paths:
      - "herramientas/**"
      - "schemas/**"
      - "vault-patrones/kondor/cuentas/**"
      - ".github/workflows/**"

jobs:
  validar-generador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pruebas de regresion del generador de cuentas
        run: python herramientas/tests/test_generador_cuentas.py
